<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kaaram Kitchen Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style id="app-css">/* Layout: banana-leaf hero band, sticky category rail, dish list + live order column on desktop, bottom order bar + sheets on phones */
:root{
  --bg:#F3F5EF; --surface:#FFFFFF; --surface-2:#EBEFE6; --ink:#15201A; --muted:#5B685F; --line:#DCE2D7;
  --leaf:#1D6B42; --leaf-ink:#FFFFFF; --leaf-soft:#E1EFE5; --turmeric:#E3A414; --turmeric-soft:#FCF1D3; --turmeric-ink:#5A4000;
  --chilli:#C23C25; --veg:#1C8A3C; --nonveg:#8A3B12;
  --plate:#F4F5F1; --plate-rim:#E0E5DB;
  --hero:#17482F; --hero-ink:#F1F5EC; --hero-muted:#B5CDBC;
  --scrim:rgba(8,16,11,.52); --shadow:0 1px 2px rgba(20,40,28,.06),0 4px 14px rgba(20,40,28,.06); --shadow-lg:0 -8px 40px rgba(10,30,18,.18);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1410; --surface:#151F19; --surface-2:#1B2820; --ink:#E6EDE7; --muted:#97A69C; --line:#26342B;
  --leaf:#52C283; --leaf-ink:#08180F; --leaf-soft:#173826; --turmeric:#F1BC3A; --turmeric-soft:#3A2F12; --turmeric-ink:#F8DA8C;
  --chilli:#EC6B50; --veg:#46C26B; --nonveg:#D9844F;
  --plate:#24312A; --plate-rim:#2E3D35;
  --hero:#0F2C1D; --hero-ink:#EAF2EA; --hero-muted:#9DB9A6;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 -8px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1410; --surface:#151F19; --surface-2:#1B2820; --ink:#E6EDE7; --muted:#97A69C; --line:#26342B;
  --leaf:#52C283; --leaf-ink:#08180F; --leaf-soft:#173826; --turmeric:#F1BC3A; --turmeric-soft:#3A2F12; --turmeric-ink:#F8DA8C;
  --chilli:#EC6B50; --veg:#46C26B; --nonveg:#D9844F;
  --plate:#24312A; --plate-rim:#2E3D35;
  --hero:#0F2C1D; --hero-ink:#EAF2EA; --hero-muted:#9DB9A6;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 -8px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--leaf);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px}
.ico{width:18px;height:18px;flex:none}

/* Hero */
.hero{background:var(--hero);color:var(--hero-ink);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
   repeating-linear-gradient(118deg,transparent 0 26px,rgba(255,255,255,.035) 26px 27px),
   radial-gradient(120% 90% at 100% 0%,rgba(227,164,20,.18),transparent 55%)}
.hero .wrap{position:relative;padding-block:18px 22px;display:grid;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;border-radius:14px;background:var(--turmeric);display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.logo svg{width:26px;height:26px}
.brand h1{font-size:clamp(22px,4.4vw,30px);font-weight:800;line-height:1.05}
.brand p{margin:2px 0 0;color:var(--hero-muted);font-size:13px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.hbtn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--hero-ink);font-weight:600;font-size:14px;border:1px solid rgba(255,255,255,.14);transition:background .15s}
.hbtn:hover{background:rgba(255,255,255,.18)}
.hbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--turmeric);box-shadow:0 0 0 0 rgba(227,164,20,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(227,164,20,0)}100%{box-shadow:0 0 0 0 rgba(227,164,20,0)}}
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.greet h2{font-size:clamp(26px,6vw,44px);font-weight:700;line-height:1.02;max-width:16ch}
.greet h2 em{font-style:normal;color:var(--turmeric)}
.table-card{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.28);border-radius:14px;padding:10px 14px}
.table-no{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1;color:var(--turmeric)}
.table-card small{display:block;color:var(--hero-muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.table-card span{font-size:13px}
.facts{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--hero-muted);font-size:13px}
.facts b{color:var(--hero-ink);font-weight:600}

/* Search + filters */
.tools{display:grid;gap:12px;padding-block:16px 4px}
.search{position:relative}
.search input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 44px 0 44px;font-size:15px;box-shadow:var(--shadow)}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 3px var(--leaf-soft)}
.search .ico{position:absolute;left:14px;top:15px;color:var(--muted)}
.search .clr{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink);transition:all .15s}
.chip[aria-pressed="true"]{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf)}
.chip.vegonly[aria-pressed="true"]{background:var(--leaf-soft);border-color:var(--veg);color:var(--veg)}
.chip.nvonly[aria-pressed="true"]{border-color:var(--nonveg);color:var(--nonveg);background:var(--surface-2)}
.switch{width:30px;height:18px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .18s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.chip[aria-pressed="true"] .switch{background:var(--veg)}
.chip[aria-pressed="true"] .switch::after{transform:translateX(12px)}

/* Category rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
.rail.stuck{border-bottom-color:var(--line)}
.rail .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px}
.rail .wrap::-webkit-scrollbar{display:none}
.cat{flex:none;height:36px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);transition:color .15s,background .15s;white-space:nowrap}
.cat:hover{color:var(--ink)}
.cat.on{background:var(--ink);color:var(--bg)}
.cat sup{font-size:10px;margin-left:3px;opacity:.7;font-variant-numeric:tabular-nums}

/* Layout */
.layout{display:grid;gap:28px;padding-block:8px 120px}
.menu{min-width:0}
@media (min-width:1024px){
  .layout{grid-template-columns:minmax(0,1fr) 370px;padding-bottom:48px}
}

/* Chef's picks */
.picks{margin-block:14px 8px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-head h2{font-size:22px;font-weight:700}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--turmeric-ink);background:var(--turmeric-soft);padding:3px 8px;border-radius:6px;display:inline-block;margin-bottom:6px}
.scroller{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,250px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 14px;scroll-padding-inline:16px}
@media (min-width:1024px){.scroller{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));grid-auto-columns:auto;overflow:visible;margin-inline:0;padding-inline:0;-webkit-mask-image:none;mask-image:none}.layout{column-gap:44px}}
.scroller::-webkit-scrollbar{display:none}
.pick{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;display:grid;gap:10px;text-align:left;cursor:pointer;transition:transform .2s,box-shadow .2s}
.pick:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.pick .art{aspect-ratio:1.25;max-width:100%;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;position:relative}
.pick .art svg{width:78%;height:auto;transition:transform .5s}
.pick:hover .art svg{transform:rotate(12deg) scale(1.03)}
.pick h3{font-size:16px;font-weight:700;line-height:1.2}
.pick-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font-weight:700;font-variant-numeric:tabular-nums}

/* Sections & cards */
.section{scroll-margin-top:72px;padding-top:22px}
.section > .sec-head{border-top:1px solid var(--line);padding-top:20px}
.items{display:grid;gap:12px}
@media (min-width:700px){.items{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:14px;padding:14px 14px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;position:relative;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:color-mix(in srgb,var(--leaf) 40%,var(--line));box-shadow:var(--shadow)}
.card-body{min-width:0;display:flex;flex-direction:column;gap:5px}
.card-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-height:18px}
.card h3{font-size:16.5px;font-weight:700;line-height:1.22}
.card .desc{color:var(--muted);font-size:13.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-top:auto;padding-top:4px}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .ico{width:14px;height:14px}
.pic{position:relative;width:112px;height:112px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;align-self:start}
.pic svg{width:96px;height:96px}
.ctl{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);display:grid;justify-items:center;gap:2px}
.ctl small{font-size:10.5px;color:var(--muted);white-space:nowrap;position:absolute;top:100%;margin-top:2px}
.add{height:36px;width:96px;border-radius:10px;background:var(--surface);color:var(--leaf);border:1.5px solid var(--leaf);font-weight:800;letter-spacing:.04em;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 10px rgba(20,60,35,.14);transition:transform .12s,background .15s}
.add:hover{background:var(--leaf-soft)}
.add:active{transform:scale(.96)}
.add b{font-size:18px;line-height:1;font-weight:700}
.step{height:36px;width:96px;border-radius:10px;background:var(--leaf);color:var(--leaf-ink);display:grid;grid-template-columns:32px 1fr 32px;align-items:center;box-shadow:0 3px 10px rgba(20,60,35,.2);font-weight:800}
.step button{height:100%;color:inherit;font-size:19px;font-weight:700;display:grid;place-items:center}
.step span{text-align:center;font-variant-numeric:tabular-nums}
.step.lg{height:46px;width:124px;grid-template-columns:40px 1fr 40px;border-radius:12px;font-size:16px}
.step.sm{height:30px;width:84px;grid-template-columns:28px 1fr 28px;border-radius:9px;font-size:13px;background:var(--leaf-soft);color:var(--leaf);box-shadow:none}

.vm{width:15px;height:15px;border:1.6px solid currentColor;border-radius:3px;display:inline-grid;place-items:center;flex:none}
.vm.veg{color:var(--veg)} .vm.nv{color:var(--nonveg)}
.vm.veg i{width:7px;height:7px;border-radius:50%;background:currentColor}
.vm.nv i{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid currentColor}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.02em;white-space:nowrap}
.tag.best{background:var(--turmeric-soft);color:var(--turmeric-ink)}
.tag.chef{background:var(--leaf-soft);color:var(--leaf)}
.tag.new{background:var(--surface-2);color:var(--chilli)}
.spice{display:inline-flex;gap:1px;color:var(--chilli)}
.spice svg{width:13px;height:13px}
.spice .off{color:var(--line)}

.empty{padding:48px 16px;text-align:center;color:var(--muted);display:grid;justify-items:center;gap:10px}
.empty svg{width:120px;height:120px}
.empty h3{color:var(--ink);font-size:19px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;transition:transform .12s,filter .15s,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--leaf);color:var(--leaf-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.primary[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.ghost:hover{background:var(--line)}
.btn.block{width:100%}
.btn .spread{margin-left:auto}
.linkbtn{color:var(--leaf);font-weight:700;font-size:14px}

/* Order panel (desktop) */
.aside{display:none}
@media (min-width:1024px){
  .aside{display:block;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 90px)}
  .panel .cart-scroll{overflow:auto;min-height:0;flex:1}
}
.cart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 18px 10px}
.cart-head h2{font-size:21px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.lines{list-style:none;margin:0;padding:0 18px}
.line{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.line .mini{width:44px;height:44px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center}
.line .mini svg{width:40px;height:40px}
.line .nm{font-weight:650;font-size:14.5px;line-height:1.25;display:flex;gap:6px;align-items:flex-start}
.line .nm .vm{margin-top:2px;width:13px;height:13px}
.line .opt{font-size:12.5px;color:var(--muted);margin-top:2px}
.line .rt{display:grid;justify-items:end;gap:6px}
.block-pad{padding:14px 18px}
.field-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
textarea{width:100%;min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;resize:vertical;font-size:14px}
textarea:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 3px var(--leaf-soft)}
.tips{display:flex;gap:8px;flex-wrap:wrap}
.tips .chip{height:34px}
.bill{display:grid;gap:7px;font-size:14px;padding:14px 18px;background:var(--bg);margin:6px 18px 14px;border-radius:14px}
.bill div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.bill .muted{color:var(--muted)}
.bill .total{font-weight:800;font-size:17px;border-top:1px dashed var(--line);padding-top:9px;margin-top:3px}
.cart-foot{padding:14px 18px 18px;border-top:1px solid var(--line);display:grid;gap:8px;background:var(--surface)}
.fine{font-size:12px;color:var(--muted);text-align:center;margin:0}
.live{margin:0 18px 6px;padding:12px 14px;border-radius:14px;background:var(--leaf-soft);display:flex;align-items:center;gap:12px;text-align:left;width:calc(100% - 36px)}
.live b{display:block;font-size:14px}
.live small{color:var(--muted);font-size:12.5px}
.live .ring{width:34px;height:34px;flex:none}

/* Bottom bar (phones) */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bar > *{pointer-events:auto}
.barbtn{width:100%;max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;height:58px;padding:0 10px 0 16px;border-radius:16px;background:var(--leaf);color:var(--leaf-ink);box-shadow:0 10px 30px rgba(10,50,28,.35);text-align:left;transition:transform .25s}
.barbtn.status{background:var(--ink);color:var(--bg)}
.barbtn .cnt{min-width:30px;height:30px;padding:0 8px;border-radius:9px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.barbtn .txt{min-width:0;flex:1;line-height:1.2}
.barbtn .txt b{display:block;font-size:15.5px}
.barbtn .txt small{opacity:.8;font-size:12.5px}
.barbtn .go{display:flex;align-items:center;gap:4px;font-weight:800;padding:8px 12px;border-radius:11px;background:rgba(255,255,255,.14);white-space:nowrap}
.bump{animation:bump .4s}
@keyframes bump{30%{transform:scale(1.04)}60%{transform:scale(.98)}}
@media (min-width:1024px){.bar{display:none}}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s;z-index:60}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.85,.25,1);box-shadow:var(--shadow-lg);overflow:hidden}
.sheet.open{transform:none}
.sheet::before{content:"";position:absolute;top:7px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:var(--line);z-index:3}
#sheetBody{display:flex;flex-direction:column;min-height:0;flex:1}
.sheet-scroll{overflow:auto;min-height:0;flex:1;overscroll-behavior:contain}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;background:var(--surface)}
.x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow);z-index:4}
@media (min-width:720px){
  .sheet{left:50%;right:auto;top:50%;bottom:auto;width:min(560px,calc(100% - 48px));max-height:min(88vh,840px);border-radius:24px;transform:translate(-50%,-46%);opacity:0;transition:transform .28s cubic-bezier(.2,.85,.25,1),opacity .2s}
  .sheet.open{transform:translate(-50%,-50%);opacity:1}
  .sheet::before{display:none}
  .sheet-foot{padding-bottom:14px}
}
.sheet-hero{background:var(--surface-2);display:grid;place-items:center;padding:30px 16px 18px;position:relative}
.sheet-hero svg{width:min(220px,58vw);height:auto;animation:spin-in .7s cubic-bezier(.2,.85,.25,1)}
@keyframes spin-in{from{transform:rotate(-40deg) scale(.9);opacity:.4}}
.pad{padding:18px}
.pad > * + *{margin-top:10px}
.item-title{font-size:25px;font-weight:700;line-height:1.12}
.item-desc{color:var(--muted);margin:0;max-width:60ch}
.facts-row{display:flex;gap:8px;flex-wrap:wrap}
.fact{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.fact .ico{width:15px;height:15px;color:var(--muted)}
fieldset{border:0;margin:18px 0 0;padding:0}
legend{display:flex;align-items:baseline;justify-content:space-between;width:100%;padding:0;margin-bottom:6px}
legend b{font-family:var(--f-display);font-size:17px;font-weight:700}
legend small{font-size:12px;color:var(--muted);font-weight:600}
.opt-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.opt-row:last-child{border-bottom:0}
.opt-row input{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:50%;margin:0;flex:none;display:grid;place-items:center;transition:border-color .15s}
.opt-row input[type=checkbox]{border-radius:6px}
.opt-row input:checked,.opt-row.on input{border-color:var(--leaf);background:var(--leaf)}
.opt-row input[type=radio]:checked,.opt-row.on input[type=radio]{background:radial-gradient(circle,var(--leaf) 0 40%,var(--surface) 46%)}
.opt-row input[type=checkbox]:checked::after,.opt-row.on input[type=checkbox]::after{content:"";width:5px;height:9px;border:solid var(--leaf-ink);border-width:0 2.2px 2.2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt-row.on{background:var(--leaf-soft);border-radius:10px;padding-left:8px;padding-right:8px;margin:0 -8px}
.opt-row.on span{font-weight:700}
.opt-row input:focus-visible{outline:2.5px solid var(--leaf);outline-offset:2px}
.opt-row span{flex:1;font-weight:550}
.opt-row em{font-style:normal;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

/* Tracker */
.track{list-style:none;margin:0;padding:0;display:grid;gap:0}
.track li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;position:relative;padding-bottom:18px}
.track li:last-child{padding-bottom:0}
.track li::before{content:"";position:absolute;left:13px;top:26px;bottom:2px;width:2px;background:var(--line)}
.track li:last-child::before{display:none}
.track li.done::before{background:var(--leaf)}
.track .bub{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;z-index:1}
.track .done .bub{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.track .now .bub{border-color:var(--leaf);box-shadow:0 0 0 5px var(--leaf-soft)}
.track .now .bub::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--leaf);animation:blink 1.2s infinite alternate}
@keyframes blink{to{opacity:.3}}
.track b{display:block;font-size:15px}
.track small{color:var(--muted);font-size:13px}
.track time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:4px}
.track .todo b{color:var(--muted);font-weight:600}
.order-card{border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px}
.order-card header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.order-card h3{font-size:18px}
.order-items{font-size:13.5px;color:var(--muted);margin:0}
.success{display:grid;justify-items:center;text-align:center;gap:8px;padding:34px 18px 8px}
.success .check{width:72px;height:72px;border-radius:50%;background:var(--leaf);color:var(--leaf-ink);display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.success .check svg{width:36px;height:36px;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .25s forwards}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.success h2{font-size:26px}
.success p{margin:0;color:var(--muted);max-width:40ch}
.req-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.req{display:grid;gap:8px;justify-items:start;text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--bg);transition:border-color .15s,background .15s}
.req:hover{border-color:var(--leaf);background:var(--leaf-soft)}
.req .ico{width:26px;height:26px;color:var(--leaf)}
.req b{font-size:15px}
.req small{color:var(--muted);font-size:12.5px;line-height:1.35}
.pay{display:grid;gap:8px}
.pay label{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;cursor:pointer}
.pay label:has(input:checked){border-color:var(--leaf);background:var(--leaf-soft)}
.pay input{accent-color:var(--leaf);width:18px;height:18px;margin:0}
.pay span{flex:1;font-weight:600}
.pay small{color:var(--muted);font-weight:500;display:block;font-size:12.5px}

.hold{position:fixed;inset:0;z-index:200;background:rgba(10,18,13,.62);display:grid;place-items:center;padding:20px;animation:holdIn .15s ease-out}
@keyframes holdIn{from{opacity:0}to{opacity:1}}
.hold-card{background:var(--surface);color:var(--ink);border-radius:24px;padding:26px 22px 20px;width:min(360px,100%);text-align:center;display:grid;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.hold-card h2{margin:0;font-size:22px}.hold-card p{margin:0 0 6px;color:var(--muted);font-size:14.5px;line-height:1.4}.hold-card p b{color:var(--ink)}
.hold-ring{position:relative;width:84px;height:84px;margin:0 auto 4px}
.hold-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.hold-ring circle{fill:none;stroke-width:4}.hold-ring .bg{stroke:var(--line)}
.hold-ring .fg{stroke:var(--turmeric);stroke-linecap:round;stroke-dasharray:132;stroke-dashoffset:0;animation:holdRing linear forwards}
@keyframes holdRing{to{stroke-dashoffset:132}}
.hold-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.hold{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:80;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25);transition:all .3s cubic-bezier(.2,.85,.25,1);pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast .ico{color:var(--turmeric)}
@media (min-width:1024px){.toast{bottom:28px}}

footer.foot{border-top:1px solid var(--line);padding-block:22px 40px;color:var(--muted);font-size:13px;display:flex;gap:8px 20px;flex-wrap:wrap;justify-content:space-between}
footer.foot button{color:var(--leaf);font-weight:700;font-size:13px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* Sold out */
.card.soldout h3,.card.soldout .price,.card.soldout .pic svg{opacity:.5}
.soldtag{height:36px;width:96px;border-radius:10px;background:var(--surface);border:1.5px dashed var(--line);color:var(--muted);font-weight:700;font-size:12.5px;display:grid;place-items:center}
.sheet-foot .btn{flex:1}

/* Admin bar */
.abar{position:sticky;top:env(safe-area-inset-top,0px);z-index:45;background:var(--ink);color:var(--bg)}
.abar .wrap{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:10px}
.abar .who{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px}
.abar .badge{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--turmeric);color:#2A1E00;padding:3px 8px;border-radius:6px;flex:none}
.abar .st{font-size:13px;opacity:.8;min-width:0}
.abar .st.dirty{opacity:1;color:var(--turmeric);font-weight:700}
.abtns{display:flex;gap:6px;flex-wrap:wrap}
.abtn{height:36px;padding:0 12px;border-radius:10px;font-weight:700;font-size:13.5px;background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.abtn:hover{background:color-mix(in srgb,var(--bg) 24%,transparent)}
.abtn.pub{background:var(--turmeric);color:#2A1E00}
.abtn[disabled]{opacity:.4;cursor:default}
.abtn .ico{width:16px;height:16px}
body.admin .rail{top:calc(env(safe-area-inset-top,0px) + var(--abar-h,0px))}
@media (min-width:1024px){body.admin .aside{top:calc(env(safe-area-inset-top,0px) + var(--abar-h,0px) + 70px)}}
body.managing .hero,body.managing .tools,body.managing .rail,body.managing .aside,body.managing .bar{display:none}
body.managing .layout{grid-template-columns:minmax(0,1fr);padding-bottom:40px}
body.managing .toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}

/* Menu manager */
.adm{padding-block:22px 40px;display:grid;gap:16px;max-width:900px;width:100%;margin:0 auto}
.adm-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.adm-head h2{font-size:clamp(24px,4vw,32px);font-weight:700}
.adm-head p{margin:4px 0 0;color:var(--muted);max-width:52ch}
.adm-tools{display:flex;gap:8px;flex-wrap:wrap}
.adm-tools .btn{height:42px}
.adm-cat{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.adm-cat > header{display:flex;align-items:center;gap:10px;padding:12px 10px 12px 18px;border-bottom:1px solid var(--line)}
.adm-cat > header > div:first-child{min-width:0;flex:1}
.adm-cat h3{font-size:18px;font-weight:700}
.adm-cat header small{color:var(--muted);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibtns{display:flex;gap:2px;flex:none}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib.danger:hover{color:var(--chilli)}
.ib[disabled]{opacity:.28;cursor:default;background:none}
.ib .ico{width:17px;height:17px}
.adm-list{list-style:none;margin:0;padding:0}
.adm-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px 8px 18px;border-bottom:1px solid var(--line)}
.adm-row .mini{width:48px;height:48px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center}
.adm-row .mini svg{width:44px;height:44px}
.adm-row.off .mini,.adm-row.off .an{opacity:.45}
.adm-main{display:grid;gap:2px;text-align:left;min-width:0;padding:4px 0}
.adm-row .an{font-weight:650;display:flex;gap:7px;align-items:center;min-width:0}
.adm-row .an > span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-row .as{font-size:12.5px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap}
.adm-row .as b{color:var(--ink)}
.ra{display:flex;align-items:center;gap:2px}
.avail{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);padding:0 6px;cursor:pointer}
.avail input{appearance:none;-webkit-appearance:none;width:36px;height:22px;border-radius:999px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s;flex:none}
.avail input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.avail input:checked{background:var(--leaf)}
.avail input:checked::after{transform:translateX(14px)}
.avail input:focus-visible{outline:2.5px solid var(--leaf);outline-offset:2px}
.avail b{min-width:22px}
.adm-none{padding:16px 18px;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line)}
.adm-add{width:100%;padding:13px 18px;text-align:left;color:var(--leaf);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.adm-add:hover{background:var(--leaf-soft)}
.adm-add .ico{width:16px;height:16px}
@media (max-width:600px){.ib.mv{display:none}.avail b{display:none}.adm-row{padding-left:12px;gap:10px}}

/* Forms */
.form{display:grid;gap:14px}
.pad.form > * + *{margin-top:0}
.f{display:grid;gap:6px;min-width:0}
.f > span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.f input[type=text],.f input[type=tel],.f input[type=number],.f select{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:15px;width:100%;color:var(--ink)}
.f input:focus,.f select:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 3px var(--leaf-soft)}
.f.err input{border-color:var(--chilli);box-shadow:0 0 0 3px color-mix(in srgb,var(--chilli) 18%,transparent)}
.f .msg{color:var(--chilli);font-size:12.5px;font-weight:600;font-style:normal}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--bg);gap:3px}
.seg label{flex:1;position:relative;min-width:0}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.seg span{display:flex;align-items:center;justify-content:center;gap:6px;height:38px;border-radius:9px;font-weight:650;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg input:checked + span{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg input:focus-visible + span{outline:2.5px solid var(--leaf)}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{position:relative}
.checks input{position:absolute;opacity:0;margin:0;inset:0;width:100%;height:100%;cursor:pointer}
.checks span{display:inline-flex;height:36px;align-items:center;padding:0 13px;border-radius:999px;border:1px solid var(--line);font-weight:650;font-size:13.5px}
.checks input:checked + span{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf)}
.checks input:focus-visible + span{outline:2.5px solid var(--leaf)}
.colors{display:flex;gap:10px;align-items:center}
.colors input[type=color]{width:46px;height:46px;border:1px solid var(--line);border-radius:12px;padding:4px;background:var(--bg);cursor:pointer}
.hint{font-size:12.5px;color:var(--muted);line-height:1.4}
.danger-txt{color:var(--chilli)}
.btn.danger{background:transparent;color:var(--chilli);border:1px solid color-mix(in srgb,var(--chilli) 40%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--chilli) 10%,transparent)}
.btn.danger.solid{background:var(--chilli);color:#fff;border:0}
.toggle-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.toggle-row span{flex:1;font-weight:600}
.toggle-row small{display:block;font-weight:500}
.lock{width:52px;height:52px;border-radius:16px;background:var(--leaf-soft);color:var(--leaf);display:grid;place-items:center}
.lock .ico{width:26px;height:26px}
.notice{padding:12px 14px;border-radius:12px;background:var(--turmeric-soft);color:var(--turmeric-ink);font-size:14px;font-weight:550}
.steps-list{margin:0;padding-left:20px;color:var(--muted);font-size:14px;display:grid;gap:4px}

/* Takeaway */
.f textarea{border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:15px;width:100%;min-height:84px;color:var(--ink);resize:vertical}
.f textarea:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 3px var(--leaf-soft)}
.f.err textarea{border-color:var(--chilli);box-shadow:0 0 0 3px color-mix(in srgb,var(--chilli) 18%,transparent)}
.f .btn{height:42px}
.cust{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:13.5px;display:grid;gap:2px}
.cust a{color:var(--leaf);font-weight:700}
.cust .maplink{display:inline-block;margin-top:2px}
/* Delivery screen */
.dsec{display:grid;gap:10px}.dsec h3{font-size:19px;display:flex;align-items:center;gap:8px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px;align-items:start}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 14px 19px;display:grid;gap:10px;position:relative;overflow:hidden;min-width:0}
.dcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--k-cook)}
.dcard.road::before{background:var(--k-ready)}.dcard.done::before{background:var(--line)}.dcard.done{opacity:.8}
.dname{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1}
.dact{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dact .btn{height:44px}
.dlines{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:14px}.dlines li{display:grid;grid-template-columns:30px 1fr;gap:4px}.dlines .q{font-weight:800}.dlines small{color:var(--muted)}
.dcollect{background:var(--turmeric-soft);color:var(--turmeric-ink);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600}
/* Kitchen display: ticket status colours */
:root{--k-new:#A86A0C;--k-new-soft:#FBEFD9;--k-cook:#1D6B42;--k-cook-soft:#E1EFE5;--k-ready:#2F64A8;--k-ready-soft:#E3ECF8;--k-late:#C23C25}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--k-new:#F1BC3A;--k-new-soft:#3A2F12;--k-cook:#52C283;--k-cook-soft:#173826;--k-ready:#82B4F2;--k-ready-soft:#17273B;--k-late:#EF7259}}
:root[data-theme="dark"]{--k-new:#F1BC3A;--k-new-soft:#3A2F12;--k-cook:#52C283;--k-cook-soft:#173826;--k-ready:#82B4F2;--k-ready-soft:#17273B;--k-late:#EF7259}
.vtabs{display:flex;background:color-mix(in srgb,var(--bg) 12%,transparent);border-radius:11px;padding:3px;gap:2px}
.vtabs button{height:32px;padding:0 11px;border-radius:8px;font-weight:700;font-size:13px;color:var(--bg);opacity:.78;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.vtabs button:hover{opacity:1}
.vtabs button[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1}
.vtabs .ico{width:15px;height:15px}
.tcount{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--turmeric);color:#2A1E00;font-size:11px;font-weight:800;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.kds{padding-block:20px 40px;display:grid;gap:16px}
.kds-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.kds-head h2{font-size:clamp(24px,4vw,32px);font-weight:700}
.kds-head p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.kds-ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kds-ctrl .seg{padding:3px}
.kds-ctrl .seg button{height:32px;padding:0 12px;border-radius:9px;font-weight:650;font-size:13.5px;color:var(--muted)}
.kds-ctrl .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.kstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){.kstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kstat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.kstat small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kstat b{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;display:block}
.kstat b.late{color:var(--k-late)} .kstat b.warn{color:var(--k-new)}
.kds-body{display:grid;gap:16px;align-items:start}
@media (min-width:1100px){.kds-body{grid-template-columns:minmax(0,1fr) 290px}}
.kmain{display:grid;gap:14px;min-width:0}
.ktables{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:14px;align-items:start}
.ktable{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;min-width:0}
.ktable > header{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}

.tk-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tk-top .no{font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
.tlabel{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1}
.kchip{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--k-new-soft);color:var(--k-new);white-space:nowrap}

.timer.warn{color:var(--k-new)} .timer.late{color:var(--k-late)}

.tk ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.tk li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:6px;align-items:start}
.tk .q{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.25;font-variant-numeric:tabular-nums}
.tk .n{font-weight:650;font-size:15.5px;line-height:1.3;display:flex;gap:6px;align-items:flex-start}
.tk .n .vm{margin-top:3px;width:13px;height:13px}
.tk .o{font-size:13px;color:var(--muted)}
.knote{font-size:13px;font-weight:700;color:var(--k-late);background:color-mix(in srgb,var(--k-late) 11%,transparent);padding:3px 8px;border-radius:6px;display:inline-block;margin-top:3px}
.tk-act{display:flex;gap:8px}

.kbump:hover{filter:brightness(1.08)} .kbump:active{transform:scale(.98)}
.kbump.n2{background:var(--k-ready)} .kbump.n3{background:var(--ink)}
.kundo{width:46px;height:46px;border-radius:12px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;flex:none}
.kundo:hover{color:var(--ink);background:var(--line)}

.kcol{background:var(--surface-2);border-radius:20px;padding:10px;display:grid;gap:10px;min-width:0}

.kcol .none{color:var(--muted);font-size:13.5px;padding:10px 6px 14px}
.kfree{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:13px}

  let id=String(g.id||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,20);if(!id||ids.has(id)){let k=out.length;do{id='g'+k++}while(ids.has(id))}ids.add(id);

let NETFEED=false,PAYON=false,PAYING=false;/* true when the server stores orders, so every device shares one kitchen feed */
function readFeed(){if(NETFEED)return FEED;try{const f=JSON.parse(lsGet(FEED_KEY)||'null');if(f&&Array.isArray(f.tickets))return f}catch(e){}return {tickets:[],seq:2416,seeded:false}}

const isDelivered=o=>{const t=ticketOf(o.no);return !!(t&&t.delivered)};

 if(!cartCount()||HOLD||PAYING)return;
 const end=Date.now()+HOLD_SECS*1000,el=document.createElement('div');
 el.className='hold';el.setAttribute('role','alertdialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-labelledby','holdT');
 el.innerHTML=`<div class="hold-card"><div class="hold-ring"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" class="bg"/><circle cx="24" cy="24" r="21" class="fg" style="animation-duration:${HOLD_SECS}s"/></svg><b id="holdN">${HOLD_SECS}</b></div>
  <h2 id="holdT">Order placed</h2><p>${pay==='online'&&PAYON?'Opening payment in':'Going to the kitchen in'} <b id="holdS">${HOLD_SECS}</b> seconds. Tapped by mistake? Cancel now and nothing is sent.</p>
  <button class="btn ghost block" data-act="hold-cancel">Cancel order</button></div>`;
 document.body.appendChild(el);
 const cb=el.querySelector('button');cb.focus();
 const t=setInterval(()=>{
  const left=Math.max(0,Math.ceil((end-Date.now())/1000));
  const n=document.getElementById('holdN'),m=document.getElementById('holdS');if(n)n.textContent=left;if(m)m.textContent=left;
  if(Date.now()>=end){clearInterval(t);HOLD=null;el.remove();if(pay==='online'&&PAYON)payOnline(btn,cust);else sendOrder(btn,cust)}
 },200);
 HOLD={el,t};
}
function cancelHold(){
 if(!HOLD)return;clearInterval(HOLD.t);HOLD.el.remove();HOLD=null;
 toast('Order cancelled. Your items are still in the cart.');
}
const orderParts=cust=>{
 const lines=S.cart.map(l=>{const it=BY[l.id];return {id:l.id,name:it.name,qty:l.qty,unit:unit(it,l.sel),opt:summary(it,l.sel),note:l.note,v:it.v}});
 const st=lines.reduce((t,l)=>t+l.qty*l.unit,0);
 return {lines,total:Math.round(st*(1+GST)+S.tip),eta:Math.max(...lines.map(l=>BY[l.id].m))+5+(IS_DL?25:IS_PU?5:0),extra:cust?{type:IS_DL?'delivery':'takeaway',customer:cust}:{}};
};
function finishOrder(o){S.orders.push(o);S.cart=[];S.note='';S.tip=0;S.bill=false;save();refreshCtls();renderPanel();renderBar();openPlaced(o)}
/* Online payment: the order is held on the server, Razorpay takes the money, and only then does it become a kitchen ticket. */
const loadRzp=()=>window.Razorpay?Promise.resolve():new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://checkout.razorpay.com/v1/checkout.js';sc.onload=ok;sc.onerror=()=>no(new Error('load'));document.head.appendChild(sc)});
async function payOnline(btn,cust){
 const span=btn.querySelector('span'),lbl=span.textContent,reset=()=>{PAYING=false;btn.disabled=false;span.textContent=lbl};
 PAYING=true;btn.disabled=true;span.textContent='Opening payment…';
 const {lines,eta,extra}=orderParts(cust),tip=S.tip,note=S.note;
 try{
  const r=await fetch('/api/pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create',table:TABLE,lines,note,tip,eta,...extra})});
  if(r.status===429){toast('Too many attempts. Please wait a moment and try again.');throw 0}
  if(r.status===400){toast(cust?(IS_PU?'Please check your name and phone number.':'Please check your name, phone, address and map link.'):'Some dishes changed. Please review your order.');throw 0}
  if(!r.ok)throw 0;
  const j=await r.json();await loadRzp();
  const rz=new window.Razorpay({key:j.keyId,amount:j.amount,currency:'INR',name:SITE.name,description:WHERE+' · '+lines.reduce((t,l)=>t+l.qty,0)+' item(s)',order_id:j.orderId,
   prefill:cust?{name:cust.name,contact:cust.phone}:{},theme:{color:'#17482F'},
   modal:{ondismiss:()=>{if(span.textContent!=='Confirming payment…')reset()}},
   handler:async resp=>{span.textContent='Confirming payment…';
    try{
     const v=await fetch('/api/pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify',...resp})});
     if(!v.ok){const e=new Error('v');e.st=v.status;throw e}const k=await v.json();
     const o={no:k.no,at:k.at,lines,tip,note,total:k.total,eta,pay:{mode:'online'},...extra};
     FEED.tickets.push({no:o.no,table:TABLE,at:o.at,eta,lines,note,st:0,ts:[o.at],kitchen:true,sample:false,total:o.total,pay:{mode:'online'},...extra});
     PAYING=false;btn.disabled=false;span.textContent=lbl;finishOrder(o);
    }catch(e){
     const ref=esc(resp.razorpay_payment_id||''),rejected=e&&e.st===400;
     PAYING=false;btn.disabled=false;span.textContent=lbl;
     if(!rejected){S.cart=[];S.note='';S.tip=0;save();refreshCtls();renderPanel();renderBar()}
     openSheet(`<div class="sheet-scroll"><div class="pad" style="padding-top:26px">${X}<h2 class="item-title">${rejected?'We couldn’t confirm your payment':'Payment is being confirmed'}</h2><p class="item-desc">${rejected?'Nothing was sent to the kitchen. If money was deducted from your account, show this reference to our staff and they will sort it out':'We couldn’t show your order number here. If your payment went through, the order reaches the kitchen within a minute or two. If it doesn’t, show this reference to our staff'}: <b class="num">${ref}</b>.</p></div></div><div class="sheet-foot"><button class="btn primary" data-act="close">OK</button></div>`,'paid','Payment');
    }}});
  rz.on('payment.failed',()=>{toast('Payment failed. Nothing was sent to the kitchen. Try again or choose cash.');reset()});
  rz.open();
 }catch(e){if(e!==0)toast('Couldn’t start the payment. Please try again or choose cash.');reset()}
}
function sendOrder(btn,cust){
 const lbl=btn.querySelector('span').textContent;
 btn.disabled=true;btn.querySelector('span').textContent=cust?'Placing your order…':'Sending to kitchen…';
 (async()=>{
  const {lines,total,eta,extra}=orderParts(cust);
  let o;
  if(NETFEED){
   try{
    const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table:TABLE,lines,note:S.note,total,eta,...extra})});
    if(r.status===429){toast('Too many orders at once. Please wait a moment and try again.');throw 0}
    if(r.status===400&&cust){toast(IS_PU?'Please check your name and phone number.':'Please check your name, phone, address and map link.');throw 0}
    if(!r.ok)throw 0;
    const j=await r.json();
    o={no:j.no,at:j.at,lines,tip:S.tip,note:S.note,total,eta,pay:{mode:'cash'},...extra};
    FEED.tickets.push({no:o.no,table:TABLE,at:o.at,eta,lines,note:S.note,st:0,ts:[o.at],kitchen:true,sample:false,total,pay:{mode:'cash'},...extra});
   }catch(e){if(e!==0)toast('Couldn’t reach the kitchen. Please try again.');btn.disabled=false;btn.querySelector('span').textContent=lbl;return}
  }else{
   FEED=readFeed();FEED.seq=(FEED.seq||2416)+1;
   o={no:'OD-'+FEED.seq,at:Date.now(),lines,tip:S.tip,note:S.note,total,eta,...extra};
   FEED.tickets.push({no:o.no,table:TABLE,at:o.at,eta:o.eta,lines,note:S.note,st:0,ts:[o.at],kitchen:false,sample:false,total:o.total,...extra});writeFeed();
  }
  finishOrder(o);
 })();
}

/* Staff login (HTTP-Basic-style username + password, checked in the browser, so it works anywhere).
   To change the login: open the browser console and run  kaaramHash('newuser','newpassword')
   then paste the printed hash into AUTH.hash below. Default login: admin / kaaram@123 */
const AUTH={hash:'a4d1250e4fd48894e8d7107614a9a1a67d68883c2473b179c5df3f08755eb328'};
function sha256(str){
 const b=unescape(encodeURIComponent(str)),K=[],H=[];let p=0;const isP=n=>{for(let i=2;i*i<=n;i++)if(n%i===0)return 0;return 1};
 const f=n=>((n-Math.floor(n))*4294967296)|0;
 for(let n=2;p<64;n++)if(isP(n)){if(p<8)H[p]=f(Math.pow(n,.5));K[p++]=f(Math.pow(n,1/3))}
 const w=[];let i,j;const L=b.length*8;let s=b+'\x80';while(s.length%64-56)s+='\0';
 for(i=0;i<s.length;i++)w[i>>2]|=s.charCodeAt(i)<<(24-(i%4)*8);
 w[w.length]=Math.floor(L/4294967296);w[w.length]=L|0;
 for(j=0;j<w.length;){const z=w.slice(j,j+=16),h=H.slice(0,8);
  for(i=0;i<64;i++){const a=h[0],e=h[4],w15=z[i-15],w2=z[i-2];
   if(i>=16)z[i]=(z[i-16]+(((w15>>>7)|(w15<<25))^((w15>>>18)|(w15<<14))^(w15>>>3))+z[i-7]+(((w2>>>17)|(w2<<15))^((w2>>>19)|(w2<<13))^(w2>>>10)))|0;
   const t1=(h[7]+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&h[5])^(~e&h[6]))+K[i]+z[i])|0;
   const t2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&h[1])^(a&h[2])^(h[1]&h[2])))|0;
   h.unshift((t1+t2)|0);h[4]=(h[4]+t1)|0;h.pop();}
  for(i=0;i<8;i++)H[i]=(H[i]+h[i])|0;}
 return H.map(x=>('00000000'+(x>>>0).toString(16)).slice(-8)).join('');
}

function dvAct(no,action){
 const t=ticketOf(no);if(!t)return;const now=Date.now();
 if(action==='pickup'){if(t.st===2){t.st=3;t.ts[3]=now}}
 else if(action==='delivered'){if(t.st===2){t.st=3;t.ts[3]=now}if(!t.delivered){t.delivered=now;t.ts[4]=now}}
 else if(t.delivered){delete t.delivered;t.ts.length=4}
 else if(t.st===3){t.st=2;t.ts.length=3}
 t.kitchen=true;
 if(NETFEED){nextPollAt=0;netDelivery(no,action)}else writeFeed();

/* Poll the shared order feed. Staff on the kitchen view ask "anything new?" every 3 s (8 s after 2 quiet minutes, 15 s after 10);
   guests check their own unserved orders every 10 s, and only while the page is visible. This keeps Redis usage low. */
function refreshTrack(){
 renderBar();renderPanel();
 if(sheetType==='orders')openOrders();
 if(sheetType==='placed'){const o=S.orders.find(x=>x.no===ctx.order);const c=body.querySelector('.order-card');if(o&&c)c.outerHTML=orderCard(o)}

async function pollOrders(){
 if(!NETFEED||pollBusy||Date.now()<nextPollAt)return;
 const kit=A.on&&A.view==='kitchen',dv=A.on&&A.view==='delivery',nos=S.orders.filter(needsTracking).map(o=>o.no);
 if(!kit&&!dv&&(!nos.length||document.hidden))return;
 pollBusy=true;
 try{
  if(kit){
   {const q=Date.now()-lastChangeAt;nextPollAt=Date.now()+(q>600000?15000:q>120000?8000:3000)}
   const r=await fetch('/api/orders?v='+encodeURIComponent(kVer),{headers:authHdr(),cache:'no-store'});
   if(r.status===401){toast('Your session expired. Sign in again.');signOut();return}
   if(r.ok){
    const j=await r.json();
    if(!j.same){
     kVer=j.v;FEED.tickets=j.tickets;
     if(!kPrimed){seen=new Set(j.tickets.map(t=>t.no));kPrimed=true;renderKitchen();renderAbar()}
     else{lastChangeAt=Date.now();feedChanged()}
    }
   }
  }else if(dv){
   nextPollAt=Date.now()+(dvList().some(t=>!t.delivered)?5000:15000);
   const r=await fetch('/api/delivery?v='+encodeURIComponent(dVer),{headers:authHdr(),cache:'no-store'});
   if(r.status===401){toast('Your session expired. Sign in again.');signOut();return}
   if(r.ok){
    const j=await r.json();
    if(!j.same){
     dVer=j.v;FEED.tickets=j.tickets;
     const fresh=j.tickets.filter(t=>t.st===2&&!dSeen.has(t.no));j.tickets.forEach(t=>dSeen.add(t.no));
     if(dPrimed&&fresh.length){chime();toast(fresh.length>1?`${fresh.length} orders ready for pickup`:`${fresh[0].no} is ready for pickup`)}
     dPrimed=true;renderDelivery();renderAbar();
    }
   }
  }else{
   nextPollAt=Date.now()+10000;
   const r=await fetch('/api/orders?nos='+encodeURIComponent(nos.slice(-20).join(',')),{cache:'no-store'});
   if(r.ok)(await r.json()).forEach(u=>{
    const t=ticketOf(u.no);
    if(t){t.st=u.st;t.ts=u.ts&&u.ts.length?u.ts:t.ts;const was=t.delivered;t.delivered=u.dl||0;if(IS_DL&&u.dl&&!was){toast('Your order has been delivered. Enjoy!');refreshTrack()}}
    else FEED.tickets.push({no:u.no,table:TABLE,at:(S.orders.find(o=>o.no===u.no)||{}).at||Date.now(),lines:[],st:u.st,ts:u.ts||[],kitchen:true,sample:false,delivered:u.dl||0});
   });
  }
 }catch(e){}finally{pollBusy=false}
}

async function doLogin(){

 }

/* Publishing shows each step: saving, then checking that guests really get the new menu. */
function pubUI(){
 let el=document.getElementById('pubp');if(el)el.remove();
 el=document.createElement('div');el.id='pubp';el.className='pubp';el.setAttribute('role','status');el.setAttribute('aria-live','polite');
 const rows=['Saving your changes','Making it live for guests'];
 el.innerHTML=`<div class="pubp-card"><b class="pubp-t">Publishing…</b><ol>${rows.map(r=>`<li class="todo"><i></i><span>${r}</span><small></small></li>`).join('')}</ol><div class="pubp-bar"><u></u></div><button class="pubp-x" hidden data-act="pub-close">Close</button></div>`;
 document.body.appendChild(el);
 const li=[...el.querySelectorAll('li')],bar=el.querySelector('.pubp-bar u'),title=el.querySelector('.pubp-t');
 const api={
  step(i,note){li.forEach((x,k)=>{x.className=k<i?'done':k===i?'now':'todo'});li[i].querySelector('small').textContent=note||'';bar.style.width=(i*50+(note?25:10))+'%'},
  done(msg,warn){li.forEach(x=>{x.className='done';x.querySelector('small').textContent=''});bar.style.width='100%';el.classList.add(warn?'warn':'ok');title.textContent=msg;el.querySelector('.pubp-x').hidden=false;setTimeout(()=>{if(el.isConnected&&!warn)el.remove()},4500)},
  fail(msg){li.forEach(x=>{if(x.className==='now')x.className='bad'});el.classList.add('bad');title.textContent=msg;el.querySelector('.pubp-x').hidden=false}
 };
 return api;
}
async function publishMenu(btn){
 if(!dirty())return;
 const next=clone(M);next.pubId=Date.now().toString(36)+rand();next.updated=Date.now();
 if(SERVER){
  if(btn){btn.disabled=true;btn.textContent='Publishing…'}
  const P=pubUI();P.step(0,'');
  const fin=()=>{renderAbar()};
  try{
   const r=await fetch('/api/menu',{method:'PUT',headers:{'Content-Type':'application/json',...authHdr()},body:JSON.stringify(next)});
   if(r.status===401){P.fail('Your session expired. Sign in again.');signOut();return}
   if(r.status===503){P.fail('Server storage isn’t set up yet. See the README.');fin();return}
   if(r.status===413){P.fail('The menu is too large to publish. Remove some dishes or shorten descriptions.');fin();return}
   if(!r.ok)throw 0;
   DATA=cleanMenu(next);M=clone(DATA);A.changes=0;lsSet(DRAFT,null);reindex();renderAll();
   /* saved. Guests read the menu through a short cache, so watch until the live address serves this version */
   const t0=Date.now();let live=false;
   for(let n=0;Date.now()-t0<30000;n++){
    P.step(1,n?`checking… ${Math.round((Date.now()-t0)/1000)}s`:'checking…');
    try{const g=await fetch('/api/menu',{cache:'no-store'});const j=g.ok?await g.json():null;if(j&&j.pubId===next.pubId){live=true;break}}catch(e){}
    await new Promise(ok=>setTimeout(ok,1500));
   }
   live?P.done('Published. Guests now see the new menu.'):P.done('Saved. Guests will see it within a minute.',true);
  }catch(e){P.fail('Couldn’t publish. Check your connection and try again.');fin()}
  return;
 }
 lsSet('kaaram-live',JSON.stringify(next));
 DATA=cleanMenu(next);M=clone(DATA);A.changes=0;lsSet(DRAFT,null);reindex();renderAll();
 try{downloadFile('kaaram-kitchen-menu.html',buildDoc(next));toast('Published on this device. An updated page file was downloaded. Upload it to your host to update every table.')}
 catch(e){toast('Published on this device.')}
}

  case 'k-bump':case 'k-undo':{FEED=readFeed();const t=ticketOf(el.dataset.no);if(!t)break;
   if(a==='k-bump'){t.st=Math.min(3,t.st+1);t.ts[t.st]=Date.now()}else{t.st=Math.max(0,t.st-1);t.ts.length=t.st+1}
   t.kitchen=true;writeFeed();renderKitchen();renderAbar();if(a==='k-bump'&&t.st===3)toast(kind(t)==='delivery'?`${whereOf(t)} dispatched · ${t.no}`:kind(t)==='takeaway'?`${whereOf(t)} handed over · ${t.no}`:`Table ${t.table} served · ${t.no}`);if(NETFEED)netPatch(t);break}
  case 'a-publish':publishMenu(el);break;
  case 'a-discard':openConfirm('Discard your changes?',`${A.changes} unpublished change${A.changes===1?'':'s'} will be lost. The live menu stays as it is.`,'Discard changes',()=>{M=clone(DATA);A.changes=0;reindex();lsSet(DRAFT,null);closeSheet();renderAll();toast('Changes discarded')});break;
  case 'a-signout':signOut();break;
  case 'a-skin':if(A.on&&SKIN_IDS.includes(el.dataset.id))mutate(m=>{m.site=cleanSite({...m.site,skin:el.dataset.id},DEF_SITE)},'Theme changed. Publish to apply it for guests.');break;
  case 'a-addcat':openCatEditor();break;
  case 'a-editcat':openCatEditor(id);break;
  case 'a-delcat':confirmDelCat(id);break;
  case 'a-catmove':moveCat(id,+el.dataset.d);break;
  case 'a-adddish':openDishEditor(null,el.dataset.cat);break;
  case 'a-edit':openDishEditor(id);break;
  case 'a-del':confirmDelDish(id);break;
  case 'a-move':moveDish(id,+el.dataset.d);break;
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&sheetType)closeSheet();
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card,.pick')){e.preventDefault();openItem(e.target.dataset.id)}
});
document.addEventListener('submit',e=>{e.preventDefault();ctx.confirm&&ctx.confirm()});
document.addEventListener('change',e=>{
 const sk=e.target.dataset&&e.target.dataset.site;
 if(sk&&A.on&&A.view==='settings'){mutate(m=>{m.site=cleanSite({...m.site,[sk]:e.target.value},DEF_SITE)});return}
 const av=e.target.dataset&&e.target.dataset.avail;
 if(av&&A.on&&BY[av]){const it=BY[av],on=e.target.checked;mutate(()=>{it.off=!on},on?`${it.name} is available`:`${it.name} marked sold out`)}
});
scrim.addEventListener('click',closeSheet);
body.addEventListener('change',e=>{if(e.target.closest&&e.target.closest('.opt-row'))body.querySelectorAll('.opt-row').forEach(r=>{const i=r.querySelector('input');r.classList.toggle('on',!!(i&&i.checked))});ctx.change&&ctx.change(e)});
/* Tapping anywhere on an option row selects it, without relying on the browser's label-to-input forwarding (flaky on some phones). */
body.addEventListener('click',e=>{const row=e.target.closest&&e.target.closest('.opt-row');if(!row||e.target.tagName==='INPUT')return;
 const i=row.querySelector('input');if(!i||i.disabled)return;e.preventDefault();
 if(i.type==='radio'){if(i.checked)return;i.checked=true}else i.checked=!i.checked;
 i.dispatchEvent(new Event('change',{bubbles:true}))});
body.addEventListener('input',e=>{if(sheetType==='dish'&&ctx.change)ctx.change(e)});
document.addEventListener('input',e=>{if(e.target.dataset.bind==='note'){S.note=e.target.value;save()}});
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{const f=b.dataset.filter;F2[f]=!F2[f];if(f==='veg'&&F2.veg)F2.nonveg=false;if(f==='nonveg'&&F2.nonveg)F2.veg=false;syncChips();renderMenu()}));
function syncChips(){document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',F2[b.dataset.filter]))}
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);$('#qclr').hidden=!e.target.value;qt=setTimeout(()=>{Q=e.target.value.trim().toLowerCase();renderMenu()},120)});
$('#qclr').addEventListener('click',e=>{e.preventDefault();$('#q').value='';$('#qclr').hidden=true;Q='';renderMenu();$('#q').focus()});

/* Scroll spy for the category rail */
let ticking=false,curCat=null;
function spy(){
 if(document.body.classList.contains('managing'))return;
 const rail=$('#rail'),ab=$('#abar').offsetHeight||0,off=rail.offsetHeight+ab+30;rail.classList.toggle('stuck',rail.getBoundingClientRect().top<=ab+1&&scrollY>40);
 let cur=null;document.querySelectorAll('.section').forEach(s=>{if(s.getBoundingClientRect().top<=off)cur=s.dataset.cat});
 if(!cur){const f=document.querySelector('.section');cur=f&&f.dataset.cat}
 if(cur===curCat&&document.querySelector('.cat.on'))return;curCat=cur;
 document.querySelectorAll('.cat').forEach(b=>{const on=b.dataset.cat===cur;b.classList.toggle('on',on);
  if(on){const w=$('#cats');const l=b.offsetLeft-w.clientWidth/2+b.offsetWidth/2;w.scrollTo({left:l,behavior:'smooth'})}});
}
addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(()=>{spy();ticking=false})}},{passive:true});
addEventListener('resize',()=>{if(A.on)document.documentElement.style.setProperty('--abar-h',$('#abar').offsetHeight+'px')});

/* Live order status */
let sig='';
setInterval(()=>{
 const fs=lsGet(FEED_KEY)||'';if(fs!==lastFeedStr){lastFeedStr=fs;FEED=readFeed();feedChanged();if(A.on)renderAbar()}
 HB=+lsGet(HB_KEY)||0;
 if(A.on&&A.view==='kitchen'){if(Date.now()-HB>5000){HB=Date.now();lsSet(HB_KEY,String(HB))}tickTimers()}
 if(!S.orders.length)return;
 const now=S.orders.map(statusIdx).join('');if(now===sig)return;
 const prev=sig;sig=now;
 if(prev&&prev.length===now.length){S.orders.forEach((o,i)=>{if(+now[i]===2&&+prev[i]===1)toast(IS_DL?`Order ${o.no} is packed and about to leave.`:IS_PU?`Order ${o.no} is ready to collect at the counter.`:`Order ${o.no} is ready. On its way to Table ${TABLE}.`)})}
 renderBar();renderPanel();
 if(sheetType==='orders')openOrders();
 if(sheetType==='placed'){const o=S.orders.find(x=>x.no===ctx.order);const c=body.querySelector('.order-card');if(o&&c)c.outerHTML=orderCard(o)}
},1000);

/* ---------- Boot ---------- */
$('#tableNo').textContent=TABLE;
const hr=new Date().getHours();
$('#greet').innerHTML=(hr<11?'Good morning.':hr<16?'Good afternoon.':'Good evening.')+' <em>'+'What are we eating?'+'</em>';
renderAll();save();sig=S.orders.map(statusIdx).join('');
const savedView=ssGet(ADMIN_SS),pathView=STAFF_PATH[PATH];
loadServerMenu().then(async()=>{
 if(SERVER&&pathView){const role=await apiAuth();if(role&&(role==='staff'||pathView==='delivery')){ssSet(AUTH_SS,'1');ssSet('kaaram-role',role);if(!A.on)enterAdmin(pathView)}}
});
if(savedView&&(pathView||FILE)){if(isAuthed())enterAdmin(pathView||savedView);else ssSet(ADMIN_SS,null)}
else if(hm==='admin')openSignin('edit');
else if(hm==='kitchen')openSignin('kitchen');
else if(hm==='rider')openSignin('delivery');
/* Back and forward move between staff screens; anything else is a different page, so reload it */
window.addEventListener('popstate',()=>{
 const v=STAFF_PATH[location.pathname.replace(/\/+$/,'').toLowerCase()];
 if(v&&A.on&&(A.role!=='rider'||v==='delivery')){if(v!==A.view)setView(v,true)}else location.reload();
});
})();
</script>
